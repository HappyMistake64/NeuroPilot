name: CodeQL

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: codeql-results
      - name: Require review of every emitted CodeQL finding
        shell: bash
        run: |
          python3 - <<'PYCODEQL'
          import json
          from pathlib import Path
          files = list(Path('codeql-results').glob('*.sarif'))
          if not files:
              raise SystemExit('CodeQL produced no SARIF report')
          count = 0
          for path in files:
              for run in json.loads(path.read_text())['runs']:
                  if any(item.get('executionSuccessful') is False for item in run.get('invocations', [])):
                      raise SystemExit('CodeQL analysis did not complete')
                  for result in run.get('results', []):
                      count += 1
                      print('Review required:', result.get('ruleId', 'unknown'), result.get('level', 'warning'))
                      for location in result.get('locations', []):
                          physical = location.get('physicalLocation', {})
                          print('Location:', physical.get('artifactLocation', {}).get('uri'), physical.get('region', {}).get('startLine'))
          print('CodeQL findings:', count)
          raise SystemExit(1 if count else 0)
          PYCODEQL
