name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned audit tooling
        run: python -m pip install --require-hashes -r requirements-security.lock.txt
      - name: Audit Python dependencies without installing model packages
        run: |
          pip-audit --disable-pip --require-hashes -r requirements.lock.txt
          pip-audit --disable-pip --require-hashes -r requirements-dev.lock.txt
          pip-audit --disable-pip --require-hashes -r requirements-ai.lock.txt
          pip-audit --disable-pip --require-hashes -r requirements-security.lock.txt
      - name: Audit locked JavaScript dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=low

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and current files without exposing matches
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all --max-archive-depth=2 --max-decode-depth=2
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --max-archive-depth=2 --max-decode-depth=2
